set_speed:
  name: Set Speed
  description: Set the animation speed of an iStrip+ light (1-100).
  fields:
    entity_id:
      description: Target light entity_id
      example: light.istrip_aabbccddeeff
      required: true
      selector:
        entity:
          domain: light
    speed:
      description: Speed value (1..100)
      required: true
      selector:
        number:
          min: 1
          max: 100
          step: 1

set_effect:
  name: Set Effect
  description: Set an effect on an iStrip+ light.
  fields:
    entity_id:
      description: Target light entity_id
      required: true
      selector:
        entity:
          domain: light
    effect:
      description: Effect name from the light's supported effect list.
      required: true
      selector:
        select:
          options:
            - 7-Color Fade
            - 3-Color Fade
            - Red Breathing
            - Red Strobe
            - 7-Color Breathing
            - 3-Color Breathing
            - Blue Breathing
            - Blue Strobe
            - 7-Color Flash
            - 3-Color Flash
            - Green Breathing
            - Green Strobe

    speed:
      description: Optional speed (1..100) to apply with the effect
      required: false
      selector:
        number:
          min: 1
          max: 100
          step: 1

start_timed_music:
  name: Start timed sound response
  description: >-
    Save the current static state and run controller microphone mode temporarily.
    Requires sound-reactive permission in Configure. Restart or ambiguous control cancels
    automatic restoration and retains a reconciliation record.
  target:
    entity:
      integration: istrip
      domain: light
  fields:
    duration:
      name: Duration
      required: true
      selector:
        number:
          min: 1
          max: 86400
          step: 1
          unit_of_measurement: s

cancel_timed_return:
  name: Cancel timed return
  description: Discard the timer or recovery record without changing the strip.
  target:
    entity:
      integration: istrip
      domain: light
